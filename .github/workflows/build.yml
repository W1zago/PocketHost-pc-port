name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Run tests (P2)
        run: ./gradlew :common:jvmTest :desktop:test --info

      - name: Build UberJar
        run: ./gradlew :desktop:packageUberJarForCurrentOS

      - name: Upload UberJar
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-uberjar-windows
          path: desktop/build/compose/jars/*.jar

  build-windows:
    runs-on: windows-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build MSI
        run: ./gradlew :desktop:packageMsi

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi

      - name: Create Distributable
        run: ./gradlew :desktop:createDistributable

      - name: Upload Distributable
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-windows-dist
          path: desktop/build/compose/binaries/main/app/

  build-linux:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Build DEB/RPM
        run: ./gradlew :desktop:packageDeb :desktop:packageRpm

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-linux-deb
          path: desktop/build/compose/binaries/main/deb/*.deb

      - name: Upload Linux RPM
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-linux-rpm
          path: desktop/build/compose/binaries/main/rpm/*.rpm

  build-macos:
    runs-on: macos-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build DMG
        run: ./gradlew :desktop:packageDmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-macos-dmg
          path: desktop/build/compose/binaries/main/dmg/*.dmg

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pockethost-windows-msi/*.msi
            pockethost-uberjar-windows/*.jar
            pockethost-linux-deb/*.deb
            pockethost-linux-rpm/*.rpm
            pockethost-macos-dmg/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
