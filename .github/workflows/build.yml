name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Run tests (P2)
        run: ./gradlew :common:jvmTest :desktop:test --info

      - name: Build UberJar
        run: ./gradlew :desktop:packageUberJarForCurrentOS

      - name: Upload UberJar
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-uberjar-windows
          path: desktop/build/compose/jars/*.jar

  build-windows:
    runs-on: windows-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build MSI and EXE (portable)
        run: ./gradlew :desktop:packageMsi :desktop:packageExe

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi

      - name: Upload Windows EXE (portable)
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe

      - name: Create Distributable
        run: ./gradlew :desktop:createDistributable

      - name: Upload Distributable
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-windows-dist
          path: desktop/build/compose/binaries/main/app/

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pockethost-windows-msi/*.msi
            pockethost-windows-exe/*.exe
            pockethost-uberjar-windows/*.jar
            pockethost-windows-dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
